# Render Blueprint: static site built from this repo on every push to main.
services:
  - type: web
    runtime: static
    name: lofight
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    previews:
      generation: off
    envVars:
      - key: VITE_LEADERBOARD_URL
        sync: false
