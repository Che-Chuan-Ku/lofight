# Render Blueprint: frontend static site + Spring Boot API (Docker) + PostgreSQL, deployed on every push to main.
# Field reference: https://render.com/docs/blueprint-spec
services:
  # Frontend: single-file Vite build served from Render's CDN.
  - type: web
    runtime: static
    name: lofight
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    previews:
      generation: off
    envVars:
      # Build-time Google Identity client id (same value as the API's GOOGLE_CLIENT_ID); empty hides login.
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
    # Same-origin proxy: the backend has no CORS, so /api/* is rewritten to the API's public onrender.com URL.
    # Routes cannot reference other services (fromService.host is a private-network name and free web services
    # cannot receive private traffic), so the URL is hard-coded. Verify it matches the API's actual
    # onrender.com URL after the first deploy (Render may append a suffix if the name is taken).
    # https://render.com/docs/redirects-rewrites
    routes:
      - type: rewrite
        source: /api/*
        destination: https://lofight-api.onrender.com/api/*

  # Backend: Spring Boot 3.2 / Java 17 built from backend/Dockerfile.
  - type: web
    runtime: docker
    name: lofight-api
    branch: main
    plan: free
    region: singapore # must match the database region for the internal connection string; immutable after creation
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Only rebuild the API when backend files change (paths are relative to the repo root).
    buildFilter:
      paths:
        - backend/**
    # No healthCheckPath: every API route requires a token (401), and HTTP checks need 2xx/3xx.
    # Render falls back to a TCP probe on $PORT. https://render.com/docs/health-checks
    envVars:
      # postgresql://user:password@host:port/database (private network); backend/docker-entrypoint.sh converts it to JDBC.
      - key: DATABASE_URL
        fromDatabase:
          name: lofight-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false

databases:
  - name: lofight-db
    plan: free # expires 30 days after creation (+14-day grace), 1 GB; https://render.com/docs/free
    region: singapore
    postgresMajorVersion: "16" # matches local docker-compose postgres:16
    databaseName: lofight
    user: lofight
    ipAllowList: [] # private network only
