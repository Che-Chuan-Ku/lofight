# Render Blueprint: one Docker web service (front-end page + Spring Boot API on the same origin) + PostgreSQL,
# deployed on every push to main. Field reference: https://render.com/docs/blueprint-spec
# JSON schema: https://render.com/schema/render.yaml.json . First switch from the old static site: backend/DEPLOY.md.
services:
  # Spring Boot 3.2 / Java 17 API that also serves the single-file Vite build at / (backend/Dockerfile).
  - type: web
    runtime: docker
    name: lofight
    branch: main
    plan: free
    region: singapore # must match the database region for the internal connection string; immutable after creation
    dockerfilePath: ./backend/Dockerfile # relative to the repo root
    dockerContext: . # repo root: the image builds the front end too (root .dockerignore limits the context)
    # Rebuild only when the front end or the backend changes (paths are relative to the repo root).
    # https://render.com/docs/build-filters
    buildFilter:
      paths:
        - src/**
        - scripts/**
        - backend/**
        - package*.json
        - vite.config.js
        - index.html
        - .dockerignore
    # No healthCheckPath: Render falls back to a TCP probe on $PORT. https://render.com/docs/health-checks
    envVars:
      # postgresql://user:password@host:port/database (private network); backend/docker-entrypoint.sh converts it to JDBC.
      - key: DATABASE_URL
        fromDatabase:
          name: lofight-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      # Read at container start: the API verifies Google tokens with it and docker-entrypoint.sh writes it into the
      # page. Empty = login entries hidden. sync:false only prompts on the first Blueprint creation.
      - key: GOOGLE_CLIENT_ID
        sync: false
      # AdSense publisher id (ca-pub-...): drives /ads.txt, the page meta and the shop ad card. Empty = all off.
      # sync:false so the value lives only in the Render dashboard: a pinned value: "" here was re-applied on every
      # Blueprint sync and wiped the dashboard value (ads.txt went 404 after the 19.1.2 render.yaml change).
      - key: ADSENSE_PUBLISHER_ID
        sync: false

databases:
  - name: lofight-db
    plan: free # expires 30 days after creation (+14-day grace), 1 GB; https://render.com/docs/free
    region: singapore
    postgresMajorVersion: "16" # matches local docker-compose postgres:16
    databaseName: lofight
    user: lofight
    ipAllowList: [] # private network only
