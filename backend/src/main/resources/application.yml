spring:
  application:
    name: api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/api_dev}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          # Instants are stored in timestamp(3) columns (UTC) as declared by erm.dbml / V1 migration.
          preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    time-zone: Asia/Taipei
  web:
    resources:
      # The only static resource is the bundled single-file front end (index.html, see backend/Dockerfile):
      # browsers must revalidate it so a new deploy is picked up immediately.
      cache:
        cachecontrol:
          no-cache: true

server:
  port: 8080

logging:
  level:
    # preferred_instant_jdbc_type is an "incubating" Hibernate setting; silence its startup notice.
    org.hibernate.orm.incubating: ERROR

api:
  prefix: /api/csg/v1

jwt:
  secret-key: ${JWT_SECRET_KEY:crowd-siege-dev-secret-key-do-not-use-in-production-0123456789}
  access-token-ttl: 15m

game:
  # Current season = "major.minor" of this build version (AMB-S6=b); filled from pom.xml by resource filtering.
  build-version: "@project.version@"
  refresh-token-ttl: 30d
  abandon-timeout: 24h
  ledger-page-size: 20
  leaderboard-size: 15
  leaderboard-neighbor-span: 2
  # D42 (2026-11-04): silver unlocks on the first NORMAL clear = first kill of bronze boss 9 (AMB-N2).
  silver-unlock-boss-seq: 9
  response-zone: Asia/Taipei
  banned-words: []
  shop-prices:
    ATTACK_SPEED: 200
    ATTACK: 200
    CANNON: 400
    LASER: 600
  tiers:
    BRONZE:
      # D42 (2026-11-04): bronze has 9 bosses; the former hidden boss is boss 9, entering after boss 8 is killed
      # (floor 98, same as boss 8); coins 1..90, full clear 241 (AMB-N3).
      boss-spawn-seconds: [14, 28, 42, 56, 70, 84, 98, 98, 98]
      boss-coins: [1, 2, 4, 8, 16, 24, 36, 60, 90]
      victory-threshold-seconds: 98
    SILVER:
      # D39 (2026-11-03): silver has 7 bosses; boss 7 enters after boss 6 is killed, floor 84 (AMB-X15=a), coins 192 (AMB-X14=b).
      boss-spawn-seconds: [14, 28, 42, 56, 70, 84, 84]
      boss-coins: [4, 8, 16, 32, 64, 128, 192]
      victory-threshold-seconds: 84

ad-reward:
  # Rewarded ad is open only when the AdSense publisher id (ca-pub-...) is set (AMB-A7=a).
  publisher-id: ${ADSENSE_PUBLISHER_ID:}
  coins: 200
  daily-limit: 5
  cooldown: 60s

season-reward:
  # Season reward (D38): coins for ranks 1-N per tier, N = list length (INF-S1); seasons before first-eligible-season never pay (INF-S11).
  # Amounts revised by user 2026-11-03: top 5 = 1200/800/400/200/100 (was top 6 = 3200/1600/800/400/200/100).
  # S9 revised 2026-11-03: season 19.0 is the first paid season (deploying 19.1.0 settles 19.0).
  rank-coins: [1200, 800, 400, 200, 100]
  first-eligible-season: "19.0"

google:
  client-id: ${GOOGLE_CLIENT_ID:}
  token-info-url: https://oauth2.googleapis.com/tokeninfo
