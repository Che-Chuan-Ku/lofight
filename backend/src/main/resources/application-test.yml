spring:
  datasource:
    url: jdbc:tc:postgresql:16:///api_test
    username: postgres
    password: postgres
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: false

jwt:
  secret-key: crowd-siege-test-secret-key-do-not-use-in-production-0123456789
  access-token-ttl: 15m

logging:
  level:
    root: WARN
    com.crowdsiege: INFO

# ECPay public stage test merchant (https://developers.ecpay.com.tw/2856/); public values, safe to commit.
ecpay:
  env: stage
  allow-test-merchant: true
  merchant-id: "3002607"
  hash-key: pwFHCqoQZGmho4w6
  hash-iv: EkRm7iFT261dpevs
  public-base-url: https://daywar.net
