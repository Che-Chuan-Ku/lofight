spring:
  datasource:
    url: jdbc:tc:postgresql:16:///api_test
    username: postgres
    password: postgres
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: false

jwt:
  secret-key: crowd-siege-test-secret-key-do-not-use-in-production-0123456789
  access-token-ttl: 15m

logging:
  level:
    root: WARN
    com.crowdsiege: INFO
