# Local development / manual verification: app + PostgreSQL (e2e tests use Testcontainers instead).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: api_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d api_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - db-data:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/api_dev
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-crowd-siege-dev-secret-key-do-not-use-in-production-0123456789}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "8080:8080"

volumes:
  db-data:
