<title>人海攻城</title>
<style>
  /* Layout: one portrait playfield (390x780 logical) letterboxed in the viewport; HUD overlays the canvas. */
  :root {
    --bg: #1b1d22;        /* cliff night */
    --fg: #f3ead6;        /* parchment text */
    --sand: #d9b97c;      /* arena ground */
    --gold: #f2c233;      /* gate bars */
    --blue: #2f66e0;      /* player army */
    --red: #d6242c;       /* enemy army */
    --font-display: "Luckiest Guy", "Arial Black", "PingFang TC", sans-serif;
    --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body);
    overflow: hidden; user-select: none; -webkit-user-select: none;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0; box-sizing: border-box;
  }
  #app { position: relative; height: 100%; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; }
  canvas { display: block; touch-action: none; border-radius: 12px; box-shadow: 0 0 0 3px #0a0b0d, 0 20px 60px rgba(0,0,0,.6); }
  #hud {
    position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between;
    padding: 10px 12px; pointer-events: none; font-family: var(--font-display); font-size: 20px;
    background: linear-gradient(rgba(0,0,0,.6), rgba(0,0,0,0)); border-radius: 12px 12px 0 0;
    letter-spacing: .5px; text-shadow: 0 2px 0 #000, 0 0 8px rgba(0,0,0,.6);
    font-variant-numeric: tabular-nums;
  }
  #hud .b { color: #8fb3ff; } #hud .r { color: #ff8a8a; } #hud .t { color: var(--gold); } #hud .k { color: #ffb0b0; }
  #status { position: absolute; left: 0; right: 0; top: 58px; text-align: center; font-size: 12px; font-weight: 700; letter-spacing: .5px;
    color: rgba(255,255,255,.9); text-shadow: 0 1px 2px #000; pointer-events: none; font-variant-numeric: tabular-nums; }
  #hud small { display: block; font-family: var(--font-body); font-size: 11px; font-weight: 700; letter-spacing: 1px; opacity: .9; }
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; background: rgba(10,11,14,.72); border-radius: 12px; text-align: center; padding: 24px; overflow: auto; -webkit-overflow-scrolling: touch;
  }
  #overlay h1 { font-family: var(--font-display); font-size: 44px; margin: 0; line-height: 1.05; text-wrap: balance;
    color: var(--gold); text-shadow: 0 3px 0 #6b4e00, 0 6px 18px rgba(0,0,0,.8); }
  #overlay h1.lose { color: #cfd4de; text-shadow: 0 3px 0 #3a3f4a, 0 6px 18px rgba(0,0,0,.8); }
  #overlay p { margin: 0; max-width: 30ch; line-height: 1.6; font-size: 14px; }
  #overlay button {
    touch-action: manipulation; font-family: var(--font-display); font-size: 22px; letter-spacing: 1px; color: #fff; background: var(--red);
    border: 0; border-radius: 10px; padding: 12px 36px; cursor: pointer; box-shadow: 0 4px 0 #7a1016;
  }
  #overlay button:active { transform: translateY(3px); box-shadow: 0 1px 0 #7a1016; }
  #overlay button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  #hint { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font-size: 12px; font-weight: 700;
    letter-spacing: 1px; color: rgba(255,255,255,.8); text-shadow: 0 1px 2px #000; pointer-events: none; transition: opacity .6s; }
  #restart {
    position: absolute; right: 12px; bottom: 12px; width: 44px; height: 44px; border-radius: 50%; border: 0;
    background: rgba(10,11,14,.72); color: #fff; font-size: 24px; line-height: 44px; padding: 0; cursor: pointer;
    box-shadow: 0 2px 0 #000, 0 0 0 2px rgba(255,255,255,.25); touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  #restart:active { transform: translateY(2px); box-shadow: 0 0 0 #000, 0 0 0 2px rgba(255,255,255,.25); }
  #restart:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  #choice {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; background: rgba(10,11,14,.6); border-radius: 12px; padding: 24px;
  }
  #choice h2 { font-family: var(--font-display); font-size: 34px; margin: 0; color: var(--gold); text-shadow: 0 3px 0 #6b4e00, 0 6px 18px rgba(0,0,0,.8); }
  #choice .cards { display: flex; gap: 14px; width: 100%; justify-content: center; }
  #choice .card {
    flex: 1 1 0; max-width: 150px; min-height: 120px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    border: 3px solid #fff; border-radius: 14px; padding: 14px 8px; color: #fff; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    background: #3a3f4a; box-shadow: 0 5px 0 #1a1c22;
  }
  #choice .card.good { background: #1f6b3a; border-color: #7dffa7; box-shadow: 0 5px 0 #0f3a1f; }
  #choice .card.bad { background: #6b1f2a; border-color: #ff8a8a; box-shadow: 0 5px 0 #3a0f15; }
  #choice .card:active { transform: translateY(4px); box-shadow: none; }
  #choice .ct { font-family: var(--font-display); font-size: 30px; letter-spacing: 1px; text-shadow: 0 2px 0 #000; }
  #choice .cd { font-size: 13px; font-weight: 700; line-height: 1.4; text-shadow: 0 1px 2px #000; }
  @media (prefers-reduced-motion: reduce) { #hint { transition: none; } }
</style>

  </div>

  const btn = document.getElementById('btn'), hint = document.getElementById('hint'), stage = document.getElementById('stage');

  const choiceBox = document.getElementById('choice'), choiceBtns = [...choiceBox.querySelectorAll('.card')];

  // ---------- path (Catmull-Rom through control points, bottom mouth at the x99 gate) ----------
  const CP = [[195, 436], [118, 388], [70, 322], [108, 256], [212, 222], [302, 168], [292, 102], [222, 52], [150, 14], [112, -40]];

    speed: { tag: 'SPD+', name: 'SPEED UP', color: '#7dffa7', apply: () => { S.blueSpeed += 18; } },

  // Pick-one-of-two pool shown when a "?" gate breaks. `good` is only used for the card colour.
  const CHOICES = {

    shotX3: { title: 'x3', desc: '每發士兵 x3', good: true, apply: () => { S.spread = Math.min(S.spread * 3, 24); } },
    shotP3: { title: '+3', desc: '每發士兵 +3', good: false, apply: () => { S.spread = Math.min(S.spread + 3, 24); } },
    shotX4: { title: 'x4', desc: '每發士兵 x4', good: true, apply: () => { S.spread = Math.min(S.spread * 4, 24); } },

  function openChoice(force) {

  // ---------- helpers ----------

  // ---------- update ----------

    for (const b of S.bosses) if (b.alive && b.mode === 0) { const d = Math.hypot(b.x - T.x, b.y - T.y); if (d < bd) { bd = d; best = [b.x, b.y]; } }

  function explode(x, y) {

        }

    for (let i = S.shells.length - 1; i >= 0; i--) {
      const sh = S.shells[i]; sh.t += dt;
      const k = Math.min(1, sh.t / sh.T);
      sh.x = sh.x0 + (sh.x1 - sh.x0) * k; sh.y = sh.y0 + (sh.y1 - sh.y0) * k - Math.sin(k * Math.PI) * 120;
      if (k >= 1) { explode(sh.x1, sh.y1); S.shells.splice(i, 1); }
    }
    // fx + pops
    for (let i = S.booms.length - 1; i >= 0; i--) { const b = S.booms[i]; b.t += dt; if (b.t > 0.25) S.booms.splice(i, 1); }
    for (let i = S.fx.length - 1; i >= 0; i--) {
      const f = S.fx[i]; f.t += dt; f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 260 * dt;
      if (f.t > f.life) { S.fx[i] = S.fx[S.fx.length - 1]; S.fx.pop(); }
    }
    for (let i = S.pops.length - 1; i >= 0; i--) { const p = S.pops[i]; p.t += dt; if (p.t > 1.2) S.pops.splice(i, 1); }
    S.shake = Math.max(0, S.shake - dt * 3);

    // victory
    if (S.bossQueue.length === 0 && S.bosses.length && S.bosses.every(b => !b.alive)) endGame(true);
  }
  function killBoss(bo) {
    if (!bo || !bo.alive) return;
    bo.alive = false; bo.hp = 0; S.shake = 1; S.bossKills++;
    addFx(bo.x, bo.y, '#ff4b4b', 40, 220); addPop('BOSS DOWN', W / 2, 200, '#ffe066');
  }
  function onReward(g) {
    const ab = ABILITIES[g.ability];
    addFx((g.x0 + g.x1) / 2, GATE_Y + 10, ab.color, 30, 180);
    ab.apply();
    addPop(ab.name, W / 2, 560, ab.color);
  }

  // ---------- render ----------
  function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
  function drawCrowd(list, color, shade, spr) {
    // The path column saturates long before the unit cap, so above `target` only every
    // `stride`-th path unit is drawn (chosen by the unit's own phase, so the sample is stable).
    const n = list.length, target = lite ? 700 : 2200, stride = n > target ? Math.ceil(n / target) : 1;
    const pick = u => stride === 1 || u.mode !== 1 || ((u.w * 1000) | 0) % stride === 0;
    if (!SPR.ready || lite) {
      ctx.fillStyle = color;
      for (const u of list) if (pick(u)) ctx.fillRect(u.x - 2, u.y - 2, 4, 4);
      ctx.fillStyle = shade;
      for (const u of list) if (pick(u)) ctx.fillRect(u.x - 2, u.y - 2, 4, 1);
      return;
    }
    const h = UNIT_PX / 2, ft = (S.t * 7) | 0;
    for (const u of list) { if (!pick(u)) continue; const f = (ft + ((u.x + u.y) * 0.37 | 0)) & 1; ctx.drawImage(spr[f], (u.x - h) | 0, (u.y - h) | 0); }
  }
  function render() {
    const sx = S.shake ? (Math.random() - 0.5) * 6 * S.shake : 0, sy = S.shake ? (Math.random() - 0.5) * 6 * S.shake : 0;
    ctx.save(); ctx.translate(sx, sy);
    // cliffs
    ctx.fillStyle = '#3d4148'; ctx.fillRect(-10, -10, W + 20, GATE_Y + 20);
    ctx.fillStyle = '#2d3036';
    for (let i = 0; i < 9; i++) ctx.fillRect(-10, i * 52 - 10, W + 20, 6);
    // arena ground with grass rim
    ctx.fillStyle = '#5c8f3a'; ctx.fillRect(-10, GATE_Y + GATE_H, W + 20, H);
    ctx.fillStyle = '#d9b97c'; ctx.fillRect(10, GATE_Y + GATE_H + 8, W - 20, H);
    ctx.fillStyle = 'rgba(0,0,0,.08)';
    for (let y = GATE_Y + GATE_H + 30; y < H; y += 44) ctx.fillRect(10, y, W - 20, 2);
    // path (rock rim + sand)
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(PL[0][0], PL[0][1]);
    for (let i = 1; i < PL.length; i++) ctx.lineTo(PL[i][0], PL[i][1]);
    ctx.strokeStyle = '#1e2025'; ctx.lineWidth = PATH_HW * 2 + 16; ctx.stroke();
    ctx.strokeStyle = '#6f9a44'; ctx.lineWidth = PATH_HW * 2 + 7; ctx.stroke();
    ctx.strokeStyle = '#cdb67e'; ctx.lineWidth = PATH_HW * 2; ctx.stroke();
    // red sea at the top edge (reserve)
    ctx.fillStyle = '#c21f28'; ctx.fillRect(-10, -10, W + 20, 36);
    ctx.fillStyle = '#e03a42';
    for (let x = 0; x < W; x += 5) for (let y = 2; y < 24; y += 5) if (((x * 7 + y * 13) % 11) < 5) ctx.fillRect(x, y, 2, 2);
    ctx.fillStyle = '#7a0f15';
    for (let x = 0; x < W; x += 9) ctx.fillRect(x, 26 + (x % 3), 5, 2);

    // red sea: solid fill from the front line up to the top of the path
    let front = PATH_LEN;
    for (const r of S.red) if (r.mode === 1 && r.s < front) front = r.s;
    if (S.red.length) {
      const s0 = Math.max(0, front + 8);
      ctx.beginPath();
      let p = pathPos(s0, 0); ctx.moveTo(p[0], p[1]);
      for (let s = s0 + 6; s <= PATH_LEN; s += 6) { p = pathPos(s, 0); ctx.lineTo(p[0], p[1]); }
      ctx.strokeStyle = '#c21f28'; ctx.lineWidth = PATH_HW * 2 - 2; ctx.stroke();
      ctx.strokeStyle = '#a3141c'; ctx.lineWidth = PATH_HW * 2 - 2; ctx.setLineDash([2, 7]); ctx.lineDashOffset = -S.t * 20; ctx.stroke(); ctx.setLineDash([]);
    }
    // units
    drawCrowd(S.red, '#d6242c', '#f27079', SPR.red);
    drawCrowd(S.blue, '#2f66e0', '#8fb3ff', SPR.blue);

    // gates
    for (const g of S.gates) {
      const w = g.x1 - g.x0;
      if (g.kind === 'mult') {
        ctx.fillStyle = '#b8860b'; roundRect(g.x0, GATE_Y, w, GATE_H, 4); ctx.fill();
        ctx.fillStyle = '#f2c233'; roundRect(g.x0 + 2, GATE_Y + 2, w - 4, GATE_H - 8, 3); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.fillRect(g.x0 - 5, GATE_Y - 6, 7, GATE_H + 12); ctx.fillRect(g.x1 - 2, GATE_Y - 6, 7, GATE_H + 12);
        ctx.fillStyle = '#2b1d00'; ctx.font = 'bold 22px "Luckiest Guy", "Arial Black", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('x' + g.mult, g.x0 + w / 2, GATE_Y + GATE_H / 2 - 1);
      } else if (!g.dead) {
        // weapon crate above the bar
        const cx = g.x0 + w / 2, top = GATE_Y - 40, ab = ABILITIES[g.ability];
        ctx.fillStyle = '#8c6a2a'; roundRect(cx - 28, top, 56, 42, 6); ctx.fill();
        const cols = Math.min(2 + g.gen, 4), rows = Math.min(2 + (g.gen >> 1), 3), r0 = cols > 3 ? 5 : 6;
        for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
          const bx = cx - (cols - 1) * (r0 + 2) + i * (r0 * 2 + 4), by = top + 9 + j * (r0 * 2 + 1);
          ctx.fillStyle = ab.color; ctx.beginPath(); ctx.arc(bx, by, r0, 0, 6.28); ctx.fill();
          ctx.fillStyle = '#1a1a1a'; ctx.beginPath(); ctx.arc(bx, by, r0 * 0.45, 0, 6.28); ctx.fill();
        }
        ctx.fillStyle = ab.color; ctx.font = 'bold 14px "Luckiest Guy", "Arial Black", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineWidth = 3; ctx.strokeStyle = '#2b1d00'; ctx.strokeText(ab.tag, cx, top - 10); ctx.fillText(ab.tag, cx, top - 10);
        ctx.fillStyle = '#7a1a1a'; roundRect(g.x0, GATE_Y, w, GATE_H, 4); ctx.fill();
        ctx.fillStyle = '#f2c233'; roundRect(g.x0 + 2, GATE_Y + 2, (w - 4) * (g.hp / g.max), GATE_H - 8, 3); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 20px "Luckiest Guy", "Arial Black", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineWidth = 3; ctx.strokeStyle = '#2b1d00'; ctx.strokeText(String(g.hp), cx, GATE_Y + GATE_H / 2 - 1); ctx.fillText(String(g.hp), cx, GATE_Y + GATE_H / 2 - 1);
      } else {
        // open gate rebuilding: dark slot with a progress bar
        ctx.fillStyle = 'rgba(0,0,0,.35)'; roundRect(g.x0, GATE_Y, w, GATE_H, 4); ctx.fill();
        const f = 1 - g.respawnT / GATE_RESPAWN;
        ctx.fillStyle = '#f2c233'; roundRect(g.x0 + 2, GATE_Y + GATE_H - 8, (w - 4) * f, 5, 2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 13px "Noto Sans TC", "PingFang TC", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      }
    }

    // bosses
    for (const bo of S.bosses) {
      if (!bo.alive) continue;
      const R = bo.r;
      const bset = SPR.bosses[bo.idx - 1];   // idx is 1-based
      if (SPR.ready && !lite && bset) {
        const im = bset[bo.hitT > 0 ? 1 : 0];
        const bob = Math.abs(Math.sin(S.t * 9)) * 3;
        ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(bo.x, bo.y + R - 2, R, R * 0.35, 0, 0, 6.28); ctx.fill();
        ctx.drawImage(im, (bo.x - im.width / 2) | 0, (bo.y - im.height / 2 - bob) | 0);
      } else {
      ctx.save(); ctx.translate(bo.x, bo.y);
      ctx.fillStyle = bo.hitT > 0 ? '#ffd0d0' : '#8e1016';
      ctx.beginPath(); ctx.arc(0, 0, R, 0, 6.28); ctx.fill();
      ctx.fillStyle = bo.hitT > 0 ? '#fff' : '#d6242c';
      ctx.beginPath(); ctx.arc(0, -2, R * 0.68, 0, 6.28); ctx.fill();
      ctx.fillStyle = '#e6e6e6';
      const spikes = 5 + bo.idx;
      for (let i = 0; i < spikes; i++) { const a = i / spikes * 6.28 + S.t * 2; ctx.beginPath(); ctx.moveTo(Math.cos(a) * R, Math.sin(a) * R); ctx.lineTo(Math.cos(a) * (R + 8), Math.sin(a) * (R + 8)); ctx.lineTo(Math.cos(a + .4) * (R - 1), Math.sin(a + .4) * (R - 1)); ctx.fill(); }
      ctx.restore();
      }
      const bw = 40 + bo.idx * 4;
      ctx.fillStyle = '#111'; roundRect(bo.x - bw / 2 - 2, bo.y - R - 20, bw + 4, 9, 3); ctx.fill();
      ctx.fillStyle = '#ff3b3b'; roundRect(bo.x - bw / 2, bo.y - R - 18, bw * (bo.hp / bo.max), 5, 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 11px "Luckiest Guy", "Arial Black", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillText(bo.hp >= 10000 ? (bo.hp / 1000).toFixed(1) + 'k' : String(bo.hp), bo.x, bo.y - R - 21);
    }

    // turret
    const T = S.turret;
    ctx.save(); ctx.translate(T.x, T.y);
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(0, 10, 22, 8, 0, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#6b4a1f'; roundRect(-18, -2, 36, 16, 4); ctx.fill();
    ctx.fillStyle = '#2f66e0'; roundRect(-16, -14, 32, 18, 5); ctx.fill();
    ctx.fillStyle = '#8fb3ff'; roundRect(-13, -12, 26, 5, 2); ctx.fill();
    const barrels = Math.min(S.spread, 8);
    for (let i = 0; i < barrels; i++) {
      const ox = (i - (barrels - 1) / 2) * (barrels > 3 ? 6 : 9);
      const bw = barrels > 3 ? 5 : 7;
      ctx.fillStyle = '#1d3f8f'; roundRect(ox - bw / 2, -34, bw, 24, 2); ctx.fill();
      ctx.fillStyle = '#9ec1ff'; ctx.fillRect(ox - 1, -34, 2, 20);
    }
    if (S.cannon.level > 0) { ctx.fillStyle = '#2b2b2b'; roundRect(-7, -46, 14, 30, 4); ctx.fill(); ctx.fillStyle = '#555'; roundRect(-5, -46, 10, 6, 2); ctx.fill(); }
    if (T.flash > 0) { ctx.fillStyle = 'rgba(255,240,160,.9)'; ctx.beginPath(); ctx.arc(0, -36, 9 + barrels * 2, 0, 6.28); ctx.fill(); }
    ctx.restore();

    // shells + blast rings
    for (const sh of S.shells) {
      ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(sh.x, sh.y0 + (sh.y1 - sh.y0) * Math.min(1, sh.t / sh.T) + 4, 6, 3, 0, 0, 6.28); ctx.fill();
      ctx.fillStyle = '#1a1a1a'; ctx.beginPath(); ctx.arc(sh.x, sh.y, 6, 0, 6.28); ctx.fill();
      ctx.fillStyle = '#ff9a3c'; ctx.beginPath(); ctx.arc(sh.x - 2, sh.y - 2, 2, 0, 6.28); ctx.fill();
    }
    for (const b of S.booms) {
      const k = b.t / 0.25; ctx.globalAlpha = 1 - k; ctx.lineWidth = 4; ctx.strokeStyle = '#ffcf5a';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.R * (0.4 + 0.6 * k), 0, 6.28); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // fx
    for (const f of S.fx) { ctx.globalAlpha = 1 - f.t / f.life; ctx.fillStyle = f.color; ctx.fillRect(f.x - 1.5, f.y - 1.5, 3, 3); }
    ctx.globalAlpha = 1;
    // popups
    for (const p of S.pops) {
      const a = p.t < 0.9 ? 1 : 1 - (p.t - 0.9) / 0.3;
      ctx.globalAlpha = Math.max(0, a);
      ctx.font = 'bold 30px "Luckiest Guy", "Arial Black", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 5; ctx.strokeStyle = '#2b1d00'; ctx.fillStyle = p.color;
      const y = p.y - p.t * 70;
      ctx.strokeText(p.text, p.x, y); ctx.fillText(p.text, p.x, y);
      if (p.sub) {
        ctx.font = 'bold 15px "Noto Sans TC", "PingFang TC", sans-serif'; ctx.lineWidth = 4; ctx.fillStyle = '#fff';
        ctx.strokeText(p.sub, p.x, y + 24); ctx.fillText(p.sub, p.x, y + 24);
      }
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // ---------- sizing / loop ----------
  let scale = 1, lite = false, slowN = 0;
  function resize() {
    const cw = document.getElementById('app').clientWidth, ch = document.getElementById('app').clientHeight;
    scale = Math.min(cw / W, ch / H);
    const dpr = Math.min(window.devicePixelRatio || 1, lite ? 1 : 2);
    cv.style.width = (W * scale) + 'px'; cv.style.height = (H * scale) + 'px';
    cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
    stage.style.width = cv.style.width; stage.style.height = cv.style.height;
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  }
  window.addEventListener('resize', resize); resize();

  let last = performance.now(), hudT = 0, renderErr = false;
  function frame(now) {
    let dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (S.started && !S.over && dt > 0.045) { if (++slowN > 45 && !lite) { lite = true; resize(); } } else slowN = Math.max(0, slowN - 1);
    update(dt);
    try { render(); } catch (err) { if (!renderErr) { renderErr = true; console.error(err); } }
    hudT += dt;
    if (hudT > 0.1) { hudT = 0; updateHud(); }
    requestAnimationFrame(frame);
  }
  function updateHud() {
    hBlue.textContent = String(S.blue.length);
    hRed.textContent = String(S.red.length);
    hTime.textContent = S.t.toFixed(0);
    hBoss.textContent = String(S.bossKills);
  }
  requestAnimationFrame(frame);

  // ---------- input ----------
  // Finger/cursor x maps directly to the turret x (absolute), so a tap anywhere also moves it.
  // Pointer and touch events are both handled; the mapping is idempotent so double delivery is harmless.
  let dragging = false;
  const clientToGame = cx => { const r = cv.getBoundingClientRect(); return (cx - r.left) / r.width * W; };
  const moveTo = x => { if (Number.isFinite(x)) S.turret.x = Math.max(22, Math.min(W - 22, x)); };
  const begin = cx => { dragging = true; hint.style.opacity = 0; moveTo(clientToGame(cx)); };
  const stop = () => { dragging = false; };
  cv.addEventListener('pointerdown', e => { begin(e.clientX); try { cv.setPointerCapture(e.pointerId); } catch (_) { /* older WebKit */ } e.preventDefault(); });
  cv.addEventListener('pointermove', e => { if (dragging) { moveTo(clientToGame(e.clientX)); e.preventDefault(); } });
  cv.addEventListener('pointerup', stop); cv.addEventListener('pointercancel', stop);
  cv.addEventListener('touchstart', e => { begin(e.touches[0].clientX); e.preventDefault(); }, { passive: false });
  cv.addEventListener('touchmove', e => { if (dragging) moveTo(clientToGame(e.touches[0].clientX)); e.preventDefault(); }, { passive: false });
  cv.addEventListener('touchend', e => { stop(); e.preventDefault(); }, { passive: false });
  cv.addEventListener('touchcancel', stop);
  const keys = {};
  window.addEventListener('keydown', e => { keys[e.key] = true; if (e.key === ' ' || e.key === 'Enter') { if (!overlay.hidden) btn.click(); } });
  window.addEventListener('keyup', e => { keys[e.key] = false; });
  setInterval(() => {
    if (!S.started || S.over) return;
    const v = (keys.ArrowRight || keys.d ? 1 : 0) - (keys.ArrowLeft || keys.a ? 1 : 0);
    if (v) S.turret.x = Math.max(22, Math.min(W - 22, S.turret.x + v * 5));
  }, 16);

  function startGame() {
    choiceBox.hidden = true;
    reset(); S.started = true; overlay.hidden = true; restartBtn.hidden = false; hint.style.opacity = 1;
    setTimeout(() => { hint.style.opacity = 0; }, 3500);
  }
  btn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', () => { startGame(); restartBtn.blur(); });
  choiceBtns.forEach(el => el.addEventListener('click', () => pickChoice(+el.dataset.i)));

  if (location.search.includes('debug')) window.__game = {
    start() { reset(); S.started = true; overlay.hidden = true; },
    step(sec, turretX) { if (turretX != null) S.turret.x = turretX; const n = Math.round(sec / (1 / 60)); for (let i = 0; i < n && !S.over; i++) update(1 / 60); render(); updateHud(); },
    turretX() { return S.turret.x; }, lite() { return lite; }, choose(i) { pickChoice(i); }, mystery(a, b) { openChoice(a && b ? [a, b] : null); }, choice() { return S.choosing ? S.choice : null; }, cannon() { return S.cannon.level; },
    bench(n) { let t0 = performance.now(); for (let i = 0; i < n; i++) update(1 / 60); const up = (performance.now() - t0) / n; t0 = performance.now(); for (let i = 0; i < n; i++) render(); return { update: +up.toFixed(2), render: +((performance.now() - t0) / n).toFixed(2) }; },
    state() { let minS = 1e9, arena = 0, maxB = -1; for (const r of S.red) { if (r.mode === 0) arena++; else if (r.s < minS) minS = r.s; } for (const u of S.blue) if (u.mode === 1 && u.s > maxB) maxB = u.s; return { minRedS: Math.round(minS), redArena: arena, maxBlueS: Math.round(maxB), shots: S.blue.filter(u => u.mode === 2).length, t: S.t, over: S.over, result: S.result, blue: S.blue.length, red: S.red.length, reserve: S.redReserve, spread: S.spread, armor: S.blueHp, speed: S.blueSpeed, kills: S.bossKills, choosing: S.choosing, cannon: S.cannon.level, gates: S.gates.map(g => g.kind === 'hp' ? g.hp + '/' + g.max + ':' + g.ability + ':g' + g.gen : 'x' + g.mult), bosses: S.bosses.filter(b => b.alive).map(b => [b.idx, b.hp, b.mode, Math.round(b.s)]) }; }
  };
})();
</script>
