<h1>DayWar</h1>
<p>DayWar 是一款打開瀏覽器就能玩的 HTML5 塔防遊戲。你守在山路底下，左右拖曳砲台射出藍軍士兵，讓他們穿過倍率門變多、打破道具門變強，一路攻向紅軍與魔王。</p>
<p>先打通 NORMAL，再去 EXTRA 見識會出招的魔王。打倒魔王賺金幣，在商店換道具，然後到排行榜上看看自己排第幾。不用下載，手機與電腦都能玩。</p>
<p>魔王不會等你準備好。</p>
